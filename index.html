<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang HK",sans-serif}
body{background:#0f172a;color:#e2e8f0;padding:env(safe-area-inset-top) 0 80px}
header{padding:16px;font-size:22px;font-weight:700}
.card{background:#1e293b;margin:10px 14px;padding:14px;border-radius:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #334155}
.row:last-child{border:0}
.muted{color:#94a3b8;font-size:13px}
.inc{color:#4ade80}.exp{color:#f87171}.tra{color:#93c5fd}
input,select,button{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px}
button{background:#3b82f6;border:0;font-weight:600}
button.sm{width:auto;padding:4px 10px;font-size:13px;background:#475569;margin:0}
.bar{height:8px;background:#334155;border-radius:4px;overflow:hidden;margin-top:4px}
.bar>div{height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1e293b;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #334155}
nav a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#94a3b8;text-decoration:none}
nav a.on{color:#60a5fa}
nav a span{display:block;font-size:20px}
.page{display:none}.page.on{display:block}
.big{font-size:26px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
canvas{width:100%}
.alert{background:#7f1d1d;color:#fecaca;padding:10px;border-radius:10px;margin:10px 14px}
</style>
</head>
<body>
<header id="title">我的財務</header>
<div id="syncSt" class="muted" style="padding:0 16px 6px"></div>
<div id="alerts"></div>

<!-- 記帳 -->
<section class="page on" id="p-tx">
 <div class="card">
  <div class="muted">本月結餘</div><div class="big" id="bal"></div>
  <div class="grid2"><div>收入 <span class="inc" id="mInc"></span></div><div>支出 <span class="exp" id="mExp"></span></div></div>
 </div>
 <div class="card">
  <div class="grid2">
   <select id="tType"><option value="exp">支出</option><option value="inc">收入</option><option value="tra">轉賬</option></select>
   <input id="tDate" type="date">
  </div>
  <select id="tCat"></select>
  <input id="tAmt" type="number" inputmode="decimal" placeholder="金額 (HKD)">
  <input id="tNote" placeholder="備註">
  <button onclick="addTx()">新增記錄</button>
 </div>
 <div class="card" id="txList"></div>
</section>

<!-- 預算 -->
<section class="page" id="p-bud">
 <div class="card">
  <select id="bCat"></select>
  <input id="bAmt" type="number" inputmode="decimal" placeholder="每月預算 (HKD)">
  <button onclick="setBudget()">設定預算</button>
 </div>
 <div class="card" id="budList"></div>
</section>

<!-- 資產 -->
<section class="page" id="p-ast">
 <div class="card"><div class="muted">總資產市值</div><div class="big" id="astTotal"></div><div id="astPL"></div></div>
 <div class="card">
  <select id="aType"><option>股票</option><option>基金/ETF</option><option>加密貨幣</option><option>現金/存款</option><option>其他</option></select>
  <input id="aName" placeholder="名稱 / 代號 (如 0700.HK)">
  <div class="grid2">
   <input id="aQty" type="number" inputmode="decimal" placeholder="數量">
   <input id="aCost" type="number" inputmode="decimal" placeholder="平均成本">
  </div>
  <input id="aPrice" type="number" inputmode="decimal" placeholder="現價">
  <button onclick="addAsset()">新增 / 更新資產</button>
 </div>
 <div class="card" id="astList"></div>
</section>

<!-- 報告 -->
<section class="page" id="p-rpt">
 <div class="card"><div class="muted">本月支出分類</div><canvas id="pie" height="260"></canvas><div id="legend"></div></div>
 <div class="card"><div class="muted">近 6 個月收支</div><canvas id="barc" height="220"></canvas></div>
 <div class="card"><div class="muted">資產配置</div><canvas id="pie2" height="260"></canvas><div id="legend2"></div></div>
</section>

<!-- 設定 -->
<section class="page" id="p-set">
 <div class="card">
  <b>匯出 CSV</b>
  <button onclick="exportCSV('tx')">匯出收支記錄</button>
  <button onclick="exportCSV('ast')">匯出資產</button>
 </div>
 <div class="card">
  <b>Google Sheets 資料庫</b>
  <p class="muted">貼上 Google Apps Script Web App 網址（見說明）</p>
  <input id="gsUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="saveGs()">儲存網址</button>
  <button onclick="syncGs()">立即同步（上傳再重新載入）</button>
 </div>
 <div class="card">
  <b>備份 / 還原</b>
  <button onclick="backup()">下載完整備份 (JSON)</button>
  <input type="file" id="restoreF" accept=".json" onchange="restore(this)">
 </div>
 <div class="card">
  <b>分類管理</b>
  <input id="newCat" placeholder="新支出分類">
  <button onclick="addCat()">加入分類</button>
 </div>
</section>

<nav>
 <a href="#" data-p="tx" class="on"><span>💰</span>記帳</a>
 <a href="#" data-p="bud"><span>🎯</span>預算</a>
 <a href="#" data-p="ast"><span>📈</span>資產</a>
 <a href="#" data-p="rpt"><span>📊</span>報告</a>
 <a href="#" data-p="set"><span>⚙️</span>設定</a>
</nav>

<script>
const K='myfin_v1';
const LS=(()=>{try{const s=window.localStorage;s.setItem('_t','1');s.removeItem('_t');return s}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>m[k]=String(v)}}})();
let D=JSON.parse(LS.getItem(K)||'null')||{
 tx:[],budgets:{},assets:[],gsUrl:'',
 cats:{exp:['飲食','交通','購物','住屋','娛樂','醫療','保險','教育','其他'],inc:['薪金','花紅','投資收益','副業','其他']}
};
if(!D.cats.tra)D.cats.tra=['八達通增值','銀行轉賬','信用卡還款','其他'];
let dirty=LS.getItem(K+'_dirty')==='1',pushT;
function setSt(t){const e=$('syncSt');if(e)e.textContent=t}
function markDirty(v){dirty=v;LS.setItem(K+'_dirty',v?'1':'0')}
const save=()=>{LS.setItem(K,JSON.stringify(D));render();if(D.gsUrl){markDirty(true);clearTimeout(pushT);pushT=setTimeout(pushRemote,800)}};
async function pushRemote(){
 if(!D.gsUrl||!dirty)return;
 setSt('⏳ 儲存到 Google Sheet 中…');
 try{await fetch(D.gsUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
   body:JSON.stringify({action:'save',tx:D.tx,assets:D.assets,budgets:D.budgets,cats:D.cats})});
  markDirty(false);setSt('✅ 已儲存到 Google Sheet '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSt('⚠️ 離線：資料已暫存在手機，連線後會自動上傳')}
}
async function loadRemote(){
 if(!D.gsUrl)return;
 if(dirty)await pushRemote();
 if(dirty)return;            // 仍然離線，保留手機資料
 setSt('⏳ 從 Google Sheet 載入中…');
 try{
  const r=await (await fetch(D.gsUrl+'?action=load')).json();
  const remoteEmpty=!r.tx.length&&!r.assets.length&&!Object.keys(r.budgets||{}).length;
  const localHas=D.tx.length||D.assets.length;
  if(!(remoteEmpty&&localHas)){   // 第一次連接時 Sheet 是空的，就保留手機資料並上傳
   D.tx=r.tx.sort((a,b)=>b.date.localeCompare(a.date));D.assets=r.assets;D.budgets=r.budgets||{};
   if(r.cats)D.cats=Object.assign(D.cats,r.cats);
  }
  let n=0;(r.pending||[]).forEach(p=>{if(autoAdd(p))n++});
  if(n)$('alerts').insertAdjacentHTML('afterbegin',`<div class="alert" style="background:#1e3a8a;color:#bfdbfe">🔔 已自動加入 ${n} 筆通知記錄，請檢查分類</div>`);
  if(n||(remoteEmpty&&localHas))save();else{LS.setItem(K,JSON.stringify(D));render()}
  setSt('✅ 已與 Google Sheet 同步 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSt('⚠️ 未能連接 Google Sheet，顯示手機內的資料')}
}
const $=id=>document.getElementById(id);
const fmt=n=>'$'+(+n).toLocaleString('zh-HK',{minimumFractionDigits:0,maximumFractionDigits:2});
const ym=d=>d.slice(0,7);
const thisM=()=>new Date().toISOString().slice(0,7);
const COLORS=['#60a5fa','#f87171','#4ade80','#facc15','#c084fc','#fb923c','#2dd4bf','#f472b6','#a3e635','#94a3b8'];

// nav
document.querySelectorAll('nav a').forEach(a=>a.onclick=e=>{e.preventDefault();
 document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$('p-'+a.dataset.p).classList.add('on');
 $('title').textContent=a.textContent.trim().slice(2)||'我的財務';
 if(a.dataset.p==='rpt')drawCharts();
});

function fillCats(){
 $('tCat').innerHTML=D.cats[$('tType').value].map(c=>`<option>${c}</option>`).join('');
 $('bCat').innerHTML=D.cats.exp.map(c=>`<option>${c}</option>`).join('');
}
$('tType').onchange=fillCats;
$('tDate').value=new Date().toISOString().slice(0,10);

function addTx(){
 const amt=parseFloat($('tAmt').value);if(!amt)return alert('請輸入金額');
 D.tx.unshift({id:Date.now(),type:$('tType').value,date:$('tDate').value,cat:$('tCat').value,amt,note:$('tNote').value});
 $('tAmt').value='';$('tNote').value='';save();
}
function delTx(id){if(confirm('刪除此記錄？')){D.tx=D.tx.filter(t=>t.id!==id);save()}}
function setBudget(){const v=parseFloat($('bAmt').value);if(v>0)D.budgets[$('bCat').value]=v;else delete D.budgets[$('bCat').value];$('bAmt').value='';save()}
function addAsset(){
 const name=$('aName').value.trim();if(!name)return;
 const a={type:$('aType').value,name,qty:+$('aQty').value||0,cost:+$('aCost').value||0,price:+$('aPrice').value||0};
 const i=D.assets.findIndex(x=>x.name===name);if(i>=0)D.assets[i]=a;else D.assets.push(a);
 ['aName','aQty','aCost','aPrice'].forEach(i=>$(i).value='');save();
}
function editPrice(i){const p=prompt('更新現價',D.assets[i].price);if(p!==null){D.assets[i].price=+p;save()}}
function delAsset(i){if(confirm('刪除？')){D.assets.splice(i,1);save()}}
function addCat(){const c=$('newCat').value.trim();if(c&&!D.cats.exp.includes(c)){D.cats.exp.push(c);$('newCat').value='';save()}}

function monthSpend(m){const s={};D.tx.filter(t=>t.type==='exp'&&ym(t.date)===m).forEach(t=>s[t.cat]=(s[t.cat]||0)+t.amt);return s}

function render(){
 fillCats();
 const m=thisM(),mt=D.tx.filter(t=>ym(t.date)===m);
 const inc=mt.filter(t=>t.type==='inc').reduce((a,t)=>a+t.amt,0),exp=mt.filter(t=>t.type==='exp').reduce((a,t)=>a+t.amt,0);
 $('bal').textContent=fmt(inc-exp);$('mInc').textContent=fmt(inc);$('mExp').textContent=fmt(exp);
 $('txList').innerHTML=D.tx.slice(0,100).map(t=>`<div class="row"><div><div>${t.cat} <span class="muted">${t.note||''}</span></div><div class="muted">${t.date}</div></div>
  <div><span class="${t.type}">${t.type==='inc'?'+':t.type==='tra'?'⇄':'-'}${fmt(t.amt)}</span> <button class="sm" onclick="delTx(${t.id})">✕</button></div></div>`).join('')||'<div class="muted">尚未有記錄</div>';
 // budgets
 const sp=monthSpend(m);let al='';
 $('budList').innerHTML=Object.entries(D.budgets).map(([c,b])=>{const u=sp[c]||0,p=Math.min(u/b*100,100);
  const col=u>b?'#ef4444':p>=80?'#facc15':'#4ade80';
  if(u>b)al+=`<div class="alert">⚠️ ${c} 已超出預算 ${fmt(u-b)}</div>`;else if(p>=80)al+=`<div class="alert" style="background:#713f12;color:#fef08a">🔔 ${c} 已用 ${p.toFixed(0)}% 預算</div>`;
  return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${c}</span><span class="muted">${fmt(u)} / ${fmt(b)}</span></div><div class="bar"><div style="width:${p}%;background:${col}"></div></div></div>`}).join('')||'<div class="muted">尚未設定預算</div>';
 $('alerts').innerHTML=al;
 // assets
 let tot=0,cost=0;
 $('astList').innerHTML=D.assets.map((a,i)=>{const v=a.qty*a.price,c=a.qty*a.cost,pl=v-c;tot+=v;cost+=c;
  return `<div class="row"><div><div>${a.name} <span class="muted">${a.type}</span></div><div class="muted">${a.qty} × ${fmt(a.price)}</div></div>
  <div style="text-align:right"><div>${fmt(v)}</div><div class="${pl>=0?'inc':'exp'}" style="font-size:13px">${pl>=0?'+':''}${fmt(pl)}${c?` (${(pl/c*100).toFixed(1)}%)`:''}</div>
  <button class="sm" onclick="editPrice(${i})">改價</button> <button class="sm" onclick="delAsset(${i})">✕</button></div></div>`}).join('')||'<div class="muted">尚未有資產</div>';
 $('astTotal').textContent=fmt(tot);
 const pl=tot-cost;$('astPL').innerHTML=`<span class="${pl>=0?'inc':'exp'}">未實現盈虧 ${pl>=0?'+':''}${fmt(pl)}</span>`;
 $('gsUrl').value=D.gsUrl||'';
}

// charts
function setupCanvas(c){const r=window.devicePixelRatio||1,w=c.clientWidth,h=+c.getAttribute('height');c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);x.clearRect(0,0,w,h);return[x,w,h]}
function pie(cid,lid,data){
 const c=$(cid),[x,w,h]=setupCanvas(c),ent=Object.entries(data).filter(e=>e[1]>0),tot=ent.reduce((a,e)=>a+e[1],0);
 if(!tot){x.fillStyle='#94a3b8';x.font='14px sans-serif';x.fillText('暫無數據',w/2-28,h/2);$(lid).innerHTML='';return}
 let a=-Math.PI/2;const r=Math.min(w,h)/2-10;
 ent.forEach(([k,v],i)=>{const s=v/tot*Math.PI*2;x.beginPath();x.moveTo(w/2,h/2);x.arc(w/2,h/2,r,a,a+s);x.fillStyle=COLORS[i%10];x.fill();a+=s});
 x.beginPath();x.arc(w/2,h/2,r*.55,0,7);x.fillStyle='#1e293b';x.fill();
 $(lid).innerHTML=ent.map(([k,v],i)=>`<div class="row"><span><span style="color:${COLORS[i%10]}">●</span> ${k}</span><span>${fmt(v)} (${(v/tot*100).toFixed(1)}%)</span></div>`).join('');
}
function drawCharts(){
 pie('pie','legend',monthSpend(thisM()));
 const al={};D.assets.forEach(a=>al[a.type]=(al[a.type]||0)+a.qty*a.price);pie('pie2','legend2',al);
 const c=$('barc'),[x,w,h]=setupCanvas(c),ms=[];const d=new Date();
 for(let i=5;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'))}
 const v=ms.map(m=>{const t=D.tx.filter(z=>ym(z.date)===m);return[t.filter(z=>z.type==='inc').reduce((a,z)=>a+z.amt,0),t.filter(z=>z.type==='exp').reduce((a,z)=>a+z.amt,0)]});
 const mx=Math.max(1,...v.flat()),bw=(w-20)/6;x.font='11px sans-serif';
 v.forEach(([i,e],k)=>{const bx=10+k*bw,ch=h-30;
  x.fillStyle='#4ade80';x.fillRect(bx+bw*.15,ch-i/mx*ch+5,bw*.3,i/mx*ch);
  x.fillStyle='#f87171';x.fillRect(bx+bw*.5,ch-e/mx*ch+5,bw*.3,e/mx*ch);
  x.fillStyle='#94a3b8';x.fillText(ms[k].slice(5)+'月',bx+bw*.25,h-8)});
}

// export
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click()}
const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function exportCSV(k){
 if(k==='tx')dl('收支記錄.csv',['日期,類型,分類,金額,備註',...D.tx.map(t=>[t.date,t.type==='inc'?'收入':t.type==='tra'?'轉賬':'支出',t.cat,t.amt,t.note].map(esc).join(','))].join('\n'),'text/csv');
 else dl('資產.csv',['類型,名稱,數量,成本,現價,市值',...D.assets.map(a=>[a.type,a.name,a.qty,a.cost,a.price,a.qty*a.price].map(esc).join(','))].join('\n'),'text/csv');
}
function backup(){dl('myfin_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(D),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{if(confirm('還原會覆蓋現有資料，確定？')){D=JSON.parse(t);save();alert('已還原')}})}
function saveGs(){D.gsUrl=$('gsUrl').value.trim().replace(/\?.*$/,'');LS.setItem(K,JSON.stringify(D));loadRemote();alert('已儲存，正在連接 Google Sheet')}
async function syncGs(){if(!D.gsUrl)return alert('請先設定 Apps Script 網址');markDirty(true);await pushRemote();await loadRemote()}

try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

// ===== 自動記帳：由 iPhone 捷徑（Apple Pay / 銀行短訊）傳入 =====
const AUTO_CAT=[[/麥當勞|mcdonald|starbucks|大家樂|美心|cafe|restaurant|餐|茶餐廳|foodpanda|deliveroo|keeta/i,'飲食'],
 [/mtr|港鐵|octopus|八達通|uber|taxi|的士|巴士|kmb|citybus/i,'交通'],
 [/hktvmall|amazon|taobao|淘寶|百佳|惠康|parknshop|wellcome|759|uniqlo|apple/i,'購物'],
 [/netflix|spotify|disney|steam|cinema|戲院/i,'娛樂'],
 [/clinic|醫|pharmacy|藥|watsons|屈臣氏|mannings|萬寧/i,'醫療']];
function guessCat(s){for(const[r,c]of AUTO_CAT)if(r.test(s||''))return D.cats.exp.includes(c)?c:'其他';return '其他'}
function parseAmt(t){const s=String(t||'').replace(/,/g,'');const m=s.match(/(?:HKD|HK\$|\$)\s*-?([0-9]+(?:\.[0-9]{1,2})?)|([0-9]+\.[0-9]{1,2})/i)||s.match(/(?:^|\n)\s*-?([0-9]+)\s*(?:\n|$)/);return m?parseFloat(m[1]||m[2]):0}
function autoAdd(p){
 const amt=parseFloat(String(p.amt||'').replace(/[^0-9.]/g,''))||parseAmt(p.text);if(!amt)return false;
 const merchant=p.merchant||'';
 const all=merchant+' '+(p.text||'');
 const date=(p.time?new Date(p.time):new Date()).toISOString().slice(0,10);
 const isTop=/增值|top.?up|OCL\*|octopus|八達通/i.test(all), isTra=isTop||/轉賬|轉帳|transfer|FPS|轉數快|還款|repayment/i.test(all);
 const isInc=!isTra&&/入賬|存入|credit|received|收到/i.test(p.text||'');
 const type=isTra?'tra':isInc?'inc':'exp';
 // 防重複：信用卡付款 + 八達通增值 同日同額只記一次
 if(isTra&&D.tx.some(t=>t.auto&&t.type==='tra'&&t.date===date&&t.amt===amt))return false;
 D.tx.unshift({id:Date.now()+Math.random(),type,date,
  cat:isTop?'八達通增值':isTra?'銀行轉賬':isInc?'其他':guessCat(all),amt,note:'🔔 '+(merchant||p.source||'自動'),auto:true});
 return true;
}
// 備用：網址參數 ?amt=..&merchant=..
(()=>{const q=new URLSearchParams(location.search);if(q.get('amt')||q.get('text')){
 if(autoAdd({amt:q.get('amt'),merchant:q.get('merchant'),text:q.get('text'),source:q.get('source')}))save();
 history.replaceState(null,'',location.pathname)}})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadRemote()});
render();
loadRemote();
</script>


</body></html>
